name: Warehouse tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: retail_warehouse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d retail_warehouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-test-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq5
          python -m pip install -r requirements-lock.txt
          python -m pip check

      - name: Run unit and integration tests
        run: python -m pytest -q test_load.py test_load_integration.py

